name: Standalone Android APK Build (Zero Unity License Required)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-standalone-android-apk:
    name: Validate & Compile Playable Standalone Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Anti-Cheat Validation Gate (Levels v3, Characters, Weapons, Audio)
        run: |
          python3 validate_levels_v3.py M01.json M02.json M03.json M04.json M05.json M06.json M07.json M08.json M09.json M10.json
          python3 validate_characters.py Assets/_Project/Art/Characters
          python3 validate_weapons.py Assets/_Project/Art/Weapons
          python3 validate_audio.py Assets/_Project/Audio
          python3 tests/verify_m09_eyesabove.py M09.json
          python3 tests/verify_m10_compoundzero.py M10.json

      - name: Sync All 10 Mission JSONs, 80 .GLB Models, and 34 .WAV Audio Cues into Android Assets
        run: |
          mkdir -p android/app/src/main/assets/Missions
          mkdir -p android/app/src/main/assets/Art/Characters
          mkdir -p android/app/src/main/assets/Art/Weapons
          mkdir -p android/app/src/main/assets/Art/Traps
          mkdir -p android/app/src/main/assets/Art/Environment
          mkdir -p android/app/src/main/assets/Audio
          cp M01.json M02.json M03.json M04.json M05.json M06.json M07.json M08.json M09.json M10.json android/app/src/main/assets/Missions/
          cp Assets/_Project/Art/Characters/*.glb android/app/src/main/assets/Art/Characters/
          cp Assets/_Project/Art/Weapons/*.glb android/app/src/main/assets/Art/Weapons/
          cp Assets/_Project/Art/Traps/*.glb android/app/src/main/assets/Art/Traps/
          cp Assets/_Project/Art/Environment/*.glb android/app/src/main/assets/Art/Environment/
          cp Assets/_Project/Audio/*.wav Assets/_Project/Audio/audio_manifest.json android/app/src/main/assets/Audio/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Standalone Playable Android APK (assembleDebug)
        working-directory: ./android
        run: |
          gradle assembleDebug --no-daemon

      - name: Package APK into Releases Folder
        run: |
          mkdir -p Releases
          cp android/app/build/outputs/apk/debug/app-debug.apk Releases/ProjectRealLoser_v1.0.apk

      - name: Upload Playable Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectRealLoser_v1.0_Android_APK
          path: |
            Releases/ProjectRealLoser_v1.0.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

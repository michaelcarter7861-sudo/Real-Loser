plugins {
    id 'com.android.application'
}

android {
    namespace 'com.realloserstudio.projectrealloser'
    compileSdk 34

    defaultConfig {
        applicationId "com.realloserstudio.projectrealloser"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    aaptOptions {
        noCompress "glb", "json", "wav"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
